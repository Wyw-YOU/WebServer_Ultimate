<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>✨ 欢迎 | 我的服务器</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0b1120, #030614);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            color: #eef2ff;
            padding: 1.5rem;
        }

        /* 动态光晕背景 */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 18s infinite alternate ease-in-out;
        }

        .glow-orb-1 {
            width: 40vw;
            height: 40vw;
            background: #3b82f6;
            top: -10%;
            left: -10%;
            animation-duration: 22s;
        }

        .glow-orb-2 {
            width: 55vw;
            height: 55vw;
            background: #8b5cf6;
            bottom: -20%;
            right: -15%;
            animation-duration: 26s;
            animation-direction: alternate-reverse;
        }

        .glow-orb-3 {
            width: 30vw;
            height: 30vw;
            background: #06b6d4;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 20s;
            opacity: 0.25;
        }

        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(5%, 8%) scale(1.1);
            }
        }

        /* 主卡片 */
        .card {
            position: relative;
            z-index: 10;
            max-width: 700px;
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(255, 255, 255, 0.05) inset;
            padding: 2rem 2.2rem 2.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 55px -15px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* 头像/装饰图标 */
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #2dd4bf, #3b82f6);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 12px 20px -8px rgba(0, 0, 0, 0.3);
            animation: softPop 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .avatar svg {
            width: 48px;
            height: 48px;
            stroke: white;
            stroke-width: 1.5;
            fill: none;
        }

        @keyframes softPop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #ffffff, #c7d2fe);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.75rem;
            animation: fadeUp 0.6s ease-out;
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(4px);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid rgba(59, 130, 246, 0.5);
            color: #a5f3fc;
            margin-bottom: 1.8rem;
            letter-spacing: 0.3px;
        }

        .desc {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #cbd5e6;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        /* 特性网格 */
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2.2rem;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 2rem;
            padding: 0.5rem 1.2rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s;
        }

        .feature-item svg {
            width: 18px;
            height: 18px;
            stroke: #60a5fa;
            stroke-width: 1.7;
            fill: none;
        }

        .feature-item:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        /* 状态栏 */
        .status {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 2rem;
            padding: 0.7rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.85rem;
            margin-top: 1rem;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
        }

        .led {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 6px #10b981;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.9);}
            100% { opacity: 1; transform: scale(1.2);}
        }

        /* 页脚 */
        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #6c7a91;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }

        /* 响应式 */
        @media (max-width: 550px) {
            .card {
                padding: 1.5rem;
            }
            h1 {
                font-size: 2.3rem;
            }
            .desc {
                font-size: 0.95rem;
            }
            .feature-item {
                padding: 0.3rem 1rem;
                font-size: 0.8rem;
            }
        }

        /* 隐藏滚动条但保持功能（可选） */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>

    <div class="card">
        <div class="avatar">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z" />
                <path d="M2 17l10 5 10-5" />
                <path d="M2 12l10 5 10-5" />
            </svg>
        </div>
        
        <h1>Hello, 世界！</h1>
        <div class="badge">✨ 服务正常运行中</div>
        
        <p class="desc">
            欢迎来到我的高性能 Web 服务器 👋<br>
            基于 epoll + 非阻塞 I/O 构建，支持高并发。
        </p>

        <div class="features">
            <div class="feature-item">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M20 12V8H4V12M20 12L12 5L4 12M20 12L12 19L4 12" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M12 5V19" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <span>高性能 I/O</span>
            </div>
            <div class="feature-item">
                <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M12 8v4l3 3" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <span>非阻塞事件驱动</span>
            </div>
            <div class="feature-item">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M4 4L20 20M20 4L4 20" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
                </svg>
                <span>安全稳定</span>
            </div>
        </div>

        <div class="status">
            <div class="led"></div>
            <span>连接状态 · 已加密传输</span>
        </div>

        <div class="footer">
            🌟 Powered by C++11 | Event-driven WebServer
        </div>
    </div>

    <!-- 可选小脚本：控制台友好提示 -->
    <script>
        console.log("%c✨ Hello from backend! 页面渲染完成 ✨", "color: #2dd4bf; font-size: 14px;");
    </script>
</body>
</html>
