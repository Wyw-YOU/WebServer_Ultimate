<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 | WebServer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1120;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #e2e8f0;
            overflow: hidden;
        }

        /* Ambient glow */
        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
            animation: float 12s ease-in-out infinite;
        }
        .glow-1 { width: 500px; height: 500px; background: #22d3ee; top: -120px; left: -100px; }
        .glow-2 { width: 400px; height: 400px; background: #6366f1; bottom: -100px; right: -80px; animation-delay: -4s; }
        .glow-3 { width: 300px; height: 300px; background: #a78bfa; top: 50%; left: 60%; animation-delay: -8s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            33%      { transform: translate(30px, -20px); }
            66%      { transform: translate(-20px, 15px); }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 48px 40px;
            width: 420px;
            max-width: 92vw;
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        .card-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, #22d3ee, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(34, 211, 238, 0.3);
        }
        .card-icon svg { width: 28px; height: 28px; color: #fff; }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.88rem;
            margin-bottom: 32px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 8px;
            letter-spacing: 0.03em;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input::placeholder {
            color: #475569;
        }
        .form-group input:focus {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            margin-top: 8px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.45);
        }
        .btn:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #334155;
            font-size: 0.78rem;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
        }
        .divider span { padding: 0 14px; }

        .hint {
            text-align: center;
            color: #475569;
            font-size: 0.8rem;
            line-height: 1.6;
        }
        .hint code {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.72rem;
            color: #334155;
            letter-spacing: 0.02em;
        }

        @media (max-width: 480px) {
            .card { padding: 36px 24px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <div class="card">
        <div class="card-icon">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
        </div>

        <h1>用户登录</h1>
        <p class="subtitle">WebServer_Ultimate 数据库连接演示</p>

        <form method="POST" action="/login" id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">登 录</button>
        </form>

        <div class="divider"><span>测试账号</span></div>
        <p class="hint">用户名 <code>admin</code> 密码 <code>123456</code></p>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/register" style="color: #6366f1; text-decoration: none; font-size: 0.88rem; font-weight: 500;">
                还没有账户？立即注册
            </a>
        </div>

        <p class="footer">Powered by C++14 | Multi-Reactor WebServer | MySQL</p>
    </div>
</body>
</html>
